[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
# background = "#1a1e25"
background = "#000000"
foreground = "#f2f2f2"

[colors.cursor]
text = "#000000"
cursor = "#4adfff"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#ffd966"

[colors.normal]
black = "#0c0c0c"
red = "#ff5c57"
green = "#7dff9a"
yellow = "#ffd966"
blue = "#6cb6ff"
magenta = "#b07aff"
cyan = "#4adfff"
white = "#d0d0d0"

[colors.bright]
black = "#1f1f1f"
red = "#ff7a76"
green = "#a6ffb5"
yellow = "#ffe38a"
blue = "#8cc7ff"
magenta = "#c59aff"
cyan = "#7ae7ff"
white = "#f2f2f2"

[colors.selection]
background = "#151515"
text = "#f2f2f2"

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.bold]
family = "Iosevka Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Iosevka Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font Mono"
style = "Regular"

[font.offset]
x = 0
y = 1

# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001b[13;4u"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
chars = "\f"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[scrolling]
history = 5000

[window]
decorations = "none"
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 6
y = 6

[terminal]
osc52 = "CopyPaste"
